name: Build GenOS test ISO

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'boot/**'
      - 'build-iso.sh'
      - 'Makefile'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils xorriso python3 file curl ca-certificates qemu-system-x86 xvfb tesseract-ocr

      - name: Download official Limine binary release
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/limine-dist boot/limine
          curl --fail --location --retry 3 https://github.com/Limine-Bootloader/Limine/releases/latest/download/limine-binary.tar.gz --output /tmp/limine-binary.tar.gz
          tar -xzf /tmp/limine-binary.tar.gz -C /tmp/limine-dist
          echo "Files in official Limine archive:"
          find /tmp/limine-dist -maxdepth 4 -type f -print | sort
          limine_bin="$(find /tmp/limine-dist -type f -name limine -print -quit)"
          if [ -z "$limine_bin" ]; then
            echo "Compiling Limine CLI from the official source archive."
            make -C /tmp/limine-dist/limine-binary
            limine_bin="$(find /tmp/limine-dist -type f -name limine -print -quit)"
          fi
          bios_sys="$(find /tmp/limine-dist -type f -name limine-bios.sys -print -quit)"
          bios_cd="$(find /tmp/limine-dist -type f -name limine-bios-cd.bin -print -quit)"
          uefi_cd="$(find /tmp/limine-dist -type f -name limine-uefi-cd.bin -print -quit)"
          test -n "$limine_bin" || { echo "::error::Limine CLI not found"; exit 1; }
          test -n "$bios_sys" || { echo "::error::limine-bios.sys not found"; exit 1; }
          test -n "$bios_cd" || { echo "::error::limine-bios-cd.bin not found"; exit 1; }
          test -n "$uefi_cd" || { echo "::error::limine-uefi-cd.bin not found"; exit 1; }
          install -m 0755 "$limine_bin" boot/limine/limine
          install -m 0644 "$bios_sys" boot/limine/limine-bios.sys
          install -m 0644 "$bios_cd" boot/limine/limine-bios-cd.bin
          install -m 0644 "$uefi_cd" boot/limine/limine-uefi-cd.bin
          boot/limine/limine --version

      - name: Compile kernel and run package tests
        run: make clean test

      - name: Build hybrid BIOS/UEFI ISO
        run: ./build-iso.sh

      - name: Smoke-test BIOS boot in QEMU and verify kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/genos-serial.log /tmp/genos-qemu.log
          xvfb-run -a qemu-system-x86_64 \
            -machine pc -m 512M -vga std \
            -cdrom build/GenOS-Genesis-x86_64.iso -boot d \
            -serial file:/tmp/genos-serial.log \
            -display gtk -no-reboot -no-shutdown \
            >/tmp/genos-qemu.log 2>&1 &
          qemu_pid=$!
          cleanup() { kill "$qemu_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          # Limine's configured timeout boots the sole entry automatically.
          for attempt in $(seq 1 30); do
            if grep -q "GENKERNEL BOOTED" /tmp/genos-serial.log 2>/dev/null; then
              cat /tmp/genos-serial.log
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "::error::QEMU exited before GenKernel boot marker"
              cat /tmp/genos-qemu.log
              cat /tmp/genos-serial.log 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::GenKernel boot marker not detected on serial console"
          cat /tmp/genos-qemu.log
          cat /tmp/genos-serial.log 2>/dev/null || true
          exit 1

      - name: Check ISO and checksum
        run: |
          set -Eeuo pipefail
          test -s build/GenOS-Genesis-x86_64.iso
          test -s build/SHA256SUMS.txt
          sha256sum --check build/SHA256SUMS.txt

      - name: Upload tested ISO
        uses: actions/upload-artifact@v4
        with:
          name: GenOS-Genesis-x86_64-ISO
          path: |
            build/GenOS-Genesis-x86_64.iso
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tested ISO as GitHub Release (optional)
        continue-on-error: true
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: genos-test-${{ github.run_number }}
          name: GenOS Genesis test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated GenOS Genesis test ISO.

            The ISO is published only after the kernel build, package tests, ISO creation, and BIOS QEMU desktop smoke test pass. This validates the tested BIOS virtual-machine path only; it does not guarantee compatibility with every physical computer or UEFI firmware.

            Check SHA256SUMS.txt before writing the ISO to USB.
          files: |
            build/GenOS-Genesis-x86_64.iso
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
