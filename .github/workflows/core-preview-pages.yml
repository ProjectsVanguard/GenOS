name: Publish GenOS Core web preview
on:
  push:
    branches: [main]
    paths:
      - 'apps/core-preview/**'
      - '.github/workflows/core-preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: genos-core-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/core-preview
          cp apps/core-preview/index.html _site/core-preview/index.html
          printf '<meta http-equiv="refresh" content="0;url=core-preview/">\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
