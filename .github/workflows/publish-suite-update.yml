name: Publish GenOS app-suite update (no ISO)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tools/gem/**'
      - 'Makefile'
      - 'tools/apply-suite-update.sh'
      - '.github/workflows/publish-suite-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-suite-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build update bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          python3 tools/gem/build_suite.py dist/org.genos.suite.gem
          python3 tools/gem/genpkg.py validate dist/org.genos.suite.gem
          zip -qr dist/GenOS-Suite-Update.zip apps
          sha256sum dist/org.genos.suite.gem > dist/GenOS-Suite.gem.sha256
          sha256sum dist/GenOS-Suite-Update.zip > dist/SHA256SUMS.txt
          cat > dist/update-manifest.json <<EOF
          {
            "product": "GenOS Suite",
            "channel": "stable",
            "mandatory": true,
            "update_policy": "required",
            "version": "suite-${GITHUB_RUN_NUMBER}",
            "commit": "${GITHUB_SHA}",
            "created_at_utc": "${GITHUB_RUN_ID}",
            "package": "org.genos.suite.gem",
            "legacy_bundle": "GenOS-Suite-Update.zip",
            "checksum_file": "SHA256SUMS.txt",
            "notice": "OBRIGATORIA: aplique esta atualização da suite.",
            "note": "App-suite bundle only. Does not contain a kernel or ISO. The mandatory flag is distribution metadata; no native GenOS updater currently enforces it."
          }
          EOF
          (cd dist && zip -q GenOS-Suite-Update.zip.sha256.zip SHA256SUMS.txt update-manifest.json)
          ls -lh dist

      - name: Upload standalone suite update
        uses: actions/upload-artifact@v4
        with:
          name: GenOS-Suite-Update-${{ github.run_number }}
          path: |
            dist/org.genos.suite.gem
            dist/GenOS-Suite.gem.sha256
            dist/GenOS-Suite-Update.zip
            dist/SHA256SUMS.txt
            dist/update-manifest.json
          if-no-files-found: error
          retention-days: 90
