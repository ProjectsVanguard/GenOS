<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS Calculadora</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#eef3ff;font:16px system-ui}.calc{width:min(340px,92vw);background:#151e32;border:1px solid #30405f;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0006}h1{font-size:20px}.display{width:100%;box-sizing:border-box;height:72px;background:#0b1020;color:#70e1cf;border:1px solid #30405f;border-radius:12px;text-align:right;padding:14px;font:28px ui-monospace,monospace;margin-bottom:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:55px;border:0;border-radius:10px;background:#26334d;color:#fff;font-size:20px;cursor:pointer}button.op,button.eq{background:#70e1cf;color:#07151b;font-weight:700}.hint{font-size:12px;color:#9baecc}</style><div class="calc"><h1>🧮 GenOS Calculadora</h1><input class="display" id="d" value="0" aria-label="Visor" readonly><div class="keys" id="keys"></div><p class="hint">Cálculos básicos no navegador.</p></div><script>const d=document.querySelector('#d');let expr='';const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];const k=document.querySelector('#keys');keys.forEach(x=>{let b=document.createElement('button');b.textContent=x;if(['÷','×','−','+','%'].includes(x))b.className='op';if(x==='=')b.className='eq';b.onclick=()=>{if(x==='C')expr='';else if(x==='⌫')expr=expr.slice(0,-1);else if(x==='='){try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/.()\- ]+$/.test(s))throw 0;let n=Function('"use strict";return ('+s+')')();expr=Number.isFinite(n)?String(n):''}catch{expr='Erro'}}else if(x==='±'){if(expr.startsWith('-'))expr=expr.slice(1);else expr='-'+expr}else if(expr==='Erro')expr=x;else expr+=x;d.value=expr||'0'};k.append(b)});</script></html>
