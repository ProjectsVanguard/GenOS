<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:420px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head{display:flex;justify-content:space-between;margin-bottom:22px}h1{font-size:28px}.calc{padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}#display{width:100%;height:86px;background:#0d111b;border:1px solid var(--line);border-radius:14px;color:var(--text);font:34px ui-monospace,monospace;text-align:right;padding:16px;margin-bottom:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:1px solid var(--line);border-radius:12px;padding:17px 4px;background:#22283a;color:var(--text);font:20px system-ui;cursor:pointer}button:hover{filter:brightness(1.2)}button.op{color:#d8ccff;background:#30294a}button.eq{background:var(--accent);color:#151122;font-weight:800}button.wide{grid-column:span 2}.hint{font-size:12px;color:var(--muted);margin-top:12px}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite</a><span>UTILITÁRIO</span></div><h1>Calculadora</h1><section class="calc"><input id="display" value="0" aria-label="Visor" readonly><div class="keys"><button data-action="clear" class="op">AC</button><button data-action="back">⌫</button><button data-value="%" class="op">%</button><button data-value="/" class="op">÷</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value="*" class="op">×</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value="-" class="op">−</button><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="+" class="op">+</button><button data-value="0" class="wide">0</button><button data-value=".">.</button><button data-action="equals" class="eq">=</button></div></section><p class="hint">Use os botões ou o teclado. Operações aritméticas básicas.</p></main><script>(()=>{const d=document.querySelector('#display');let expr='';function show(){d.value=expr||'0'}function calc(){if(!expr||!/^[0-9+*/().% -]+$/.test(expr))return;try{const result=Function('"use strict";return ('+expr.replace(/%/g,'/100')+')')();if(Number.isFinite(result)){expr=String(Number(result.toPrecision(12)));show()}else{d.value='Erro';expr=''}}catch{d.value='Expressão inválida';expr=''}}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='clear'){expr='';show()}else if(b.dataset.action==='back'){expr=expr.slice(0,-1);show()}else if(b.dataset.action==='equals')calc();else{if(expr.length<70)expr+=b.dataset.value;show()}});document.addEventListener('keydown',e=>{if(/^[0-9.+*/()% -]$/.test(e.key)){expr+=e.key;show()}else if(e.key==='Enter')calc();else if(e.key==='Backspace'){expr=expr.slice(0,-1);show()}else if(e.key==='Escape'){expr='';show()}})})();</script></body></html>
