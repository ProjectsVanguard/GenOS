<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:18px 0}.controls button,button{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer}.month{font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}.dayname{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:72px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}.day.today{border-color:var(--accent)}.day.selected{background:#292442;border-color:var(--accent)}.dot{display:block;width:6px;height:6px;background:#67e8f9;border-radius:50%;margin-top:7px}.events{margin-top:22px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.form input{flex:1;min-width:140px;padding:10px;background:#0d1018;border:1px solid var(--line);border-radius:9px;color:var(--text)}.event{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.muted{color:var(--muted);font-size:13px}@media(max-width:500px){.day{min-height:48px;padding:5px}.grid{gap:3px}}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite GenOS</a><span>ORGANIZAÇÃO</span></div><h1>Calendário</h1><div class="controls"><button id="prev">← Anterior</button><div class="month" id="month"></div><button id="next">Próximo →</button></div><div class="grid" id="grid"></div><section class="events"><h2 id="selected-title">Eventos</h2><div id="events" class="muted">Selecione uma data.</div><form class="form" id="form"><input id="event-title" maxlength="120" placeholder="Nome do evento" required><button type="submit">Adicionar</button></form><p class="muted">Os eventos ficam salvos apenas neste navegador.</p></section></main><script>(()=>{const $=s=>document.querySelector(s),now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=now.toISOString().slice(0,10),events={};try{events=JSON.parse(localStorage.getItem('genos.calendar.v1')||'{}')}catch{}const names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];function save(){try{localStorage.setItem('genos.calendar.v1',JSON.stringify(events))}catch{}}function render(){ $('#month').textContent=names[month]+' '+year;const g=$('#grid');g.replaceChildren();['D','S','T','Q','Q','S','S'].forEach(n=>{const el=document.createElement('div');el.className='dayname';el.textContent=n;g.append(el)});const offset=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();for(let i=0;i<offset;i++){const el=document.createElement('div');g.append(el)}for(let d=1;d<=total;d++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),el=document.createElement('button');el.className='day'+(key===selected?' selected':'')+(key===now.toISOString().slice(0,10)?' today':'');el.textContent=d;el.setAttribute('aria-label',key);if((events[key]||[]).length){const dot=document.createElement('span');dot.className='dot';el.append(dot)}el.onclick=()=>{selected=key;render();showEvents()};g.append(el)}showEvents()}function showEvents(){$('#selected-title').textContent='Eventos · '+selected;const list=$('#events');list.replaceChildren();const items=events[selected]||[];if(!items.length){list.textContent='Nenhum evento para esta data.';list.className='muted';return}list.className='';items.forEach((title,i)=>{const row=document.createElement('div'),txt=document.createElement('span'),del=document.createElement('button');row.className='event';txt.textContent=title;del.textContent='Remover';del.onclick=()=>{events[selected].splice(i,1);if(!events[selected].length)delete events[selected];save();render()};row.append(txt,del);list.append(row)})}$('#prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('#next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('#form').onsubmit=e=>{e.preventDefault();const value=$('#event-title').value.trim();if(!value)return;(events[selected]??=[]).push(value);save();$('#event-title').value='';render()};render()})();</script></body></html>
