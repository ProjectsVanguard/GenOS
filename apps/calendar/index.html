<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS Calendário</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui}.wrap{max-width:850px;margin:30px auto;padding:20px}.panel{background:#151e32;border:1px solid #30405f;border-radius:16px;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}button{background:#70e1cf;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}.day,.dow{text-align:center;padding:12px 2px;border-radius:8px}.dow{color:#9baecc;font-size:13px}.day{background:#202c43;min-height:24px}.today{outline:2px solid #70e1cf}.events{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}input{background:#0b1020;border:1px solid #30405f;color:white;padding:10px;border-radius:8px;flex:1;min-width:150px}.event{padding:10px;background:#202c43;border-radius:8px;margin-top:7px}</style><div class="wrap"><div class="panel"><header><h1>📅 Calendário</h1><div><button id="prev">‹</button> <button id="next">›</button></div></header><h2 id="label"></h2><div class="grid" id="grid"></div><section class="events"><input id="event" placeholder="Novo evento"><input id="date" type="date"><button id="add">Adicionar</button></section><div id="list"></div></div></div><script>let view=new Date();const $=s=>document.querySelector(s);function render(){let y=view.getFullYear(),m=view.getMonth();$('#label').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(view);let g=$('#grid');g.innerHTML='';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(x=>{let e=document.createElement('div');e.className='dow';e.textContent=x;g.append(e)});let start=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<start;i++)g.append(document.createElement('div'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let e=document.createElement('div');e.className='day';if(d===new Date().getDate()&&m===new Date().getMonth()&&y===new Date().getFullYear())e.classList.add('today');e.textContent=d;g.append(e)}let events=JSON.parse(localStorage.getItem('genos-events')||'[]');$('#list').innerHTML='<h3>Eventos salvos neste navegador</h3>'+events.map((e,i)=>'<div class="event">'+e.date+' — '+e.title+' <button data-i="'+i+'">×</button></div>').join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{events.splice(+b.dataset.i,1);localStorage.setItem('genos-events',JSON.stringify(events));render()})}$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('#add').onclick=()=>{let title=$('#event').value.trim(),date=$('#date').value;if(!title||!date)return alert('Preencha o evento e a data.');let a=JSON.parse(localStorage.getItem('genos-events')||'[]');a.push({title,date});localStorage.setItem('genos-events',JSON.stringify(a));$('#event').value='';render()};render();</script></html>
