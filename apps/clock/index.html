<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relógio · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:800px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head{display:flex;justify-content:space-between}.clock{margin:35px 0;padding:36px 15px;text-align:center;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1a2030,#121722)}#time{font-size:clamp(48px,12vw,92px);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums}#date{color:var(--muted);margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}button,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:#242a3d;color:var(--text)}button{cursor:pointer}input{width:100%;margin:8px 0}.digits{font-size:32px;font-weight:750;margin:14px 0;font-variant-numeric:tabular-nums}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite GenOS</a><span>RELÓGIO</span></div><section class="clock"><div id="time">00:00:00</div><div id="date"></div></section><section class="grid"><article class="card"><h2>Cronômetro</h2><div class="digits" id="sw">00:00.0</div><div class="actions"><button id="start">Iniciar</button><button id="lap">Marcar volta</button><button id="reset">Zerar</button></div><ol id="laps" class="muted"></ol></article><article class="card"><h2>Temporizador</h2><p class="muted">Defina a duração em minutos.</p><input id="minutes" type="number" min="1" max="1440" value="5" aria-label="Minutos"><div class="digits" id="timer">05:00</div><div class="actions"><button id="timer-start">Iniciar</button><button id="timer-reset">Reiniciar</button></div><p id="timer-state" class="muted">Pronto</p></article></section></main><script>(()=>{const $=s=>document.querySelector(s);function tick(){const d=new Date();$('#time').textContent=d.toLocaleTimeString('pt-BR');$('#date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}tick();setInterval(tick,250);let swStart=0,elapsed=0,swRun=false,swInt;function fmt(ms){const t=Math.floor(ms/100),m=Math.floor(t/600),s=Math.floor(t/10)%60,x=t%10;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+x}function drawSw(){$('#sw').textContent=fmt(elapsed+(swRun?Date.now()-swStart:0))}$('#start').onclick=()=>{swRun=!swRun;if(swRun){swStart=Date.now();$('#start').textContent='Pausar';swInt=setInterval(drawSw,100)}else{elapsed+=Date.now()-swStart;$('#start').textContent='Continuar';clearInterval(swInt);drawSw()}};$('#lap').onclick=()=>{const li=document.createElement('li');li.textContent=fmt(elapsed+(swRun?Date.now()-swStart:0));$('#laps').prepend(li)};$('#reset').onclick=()=>{swRun=false;elapsed=0;clearInterval(swInt);$('#start').textContent='Iniciar';$('#laps').replaceChildren();drawSw()};let remaining=300,deadline=0,run=false,int;function drawTimer(){const n=Math.max(0,remaining-(run?Math.ceil((Date.now()-deadline)/1000):0));$('#timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(run&&n<=0){run=false;clearInterval(int);$('#timer-state').textContent='Tempo encerrado';$('#timer-start').textContent='Iniciar'}}$('#minutes').onchange=()=>{remaining=Math.max(60,Math.min(86400,Number($('#minutes').value||1)*60));run=false;clearInterval(int);$('#timer-start').textContent='Iniciar';$('#timer-state').textContent='Pronto';drawTimer()};$('#timer-start').onclick=()=>{if(run){remaining=Math.max(0,remaining-Math.ceil((Date.now()-deadline)/1000));run=false;clearInterval(int);$('#timer-start').textContent='Continuar';$('#timer-state').textContent='Pausado'}else{deadline=Date.now();run=true;int=setInterval(drawTimer,200);$('#timer-start').textContent='Pausar';$('#timer-state').textContent='Em andamento'}drawTimer()};$('#timer-reset').onclick=()=>{$('#minutes').dispatchEvent(new Event('change'));$('#timer-state').textContent='Reiniciado'};drawSw();drawTimer()})();</script></body></html>
