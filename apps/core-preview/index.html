<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS v2 — demonstração interativa</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 20%,#284b8a,#101c38 58%,#080f21);min-height:100vh}.notice{background:#172744;padding:11px 16px;font-size:13px;border-bottom:1px solid #526587;text-align:center}.desktop{height:calc(100vh - 96px);min-height:380px;padding:25px;position:relative}.brand{position:absolute;right:30px;top:25px;font-size:22px;font-weight:700;opacity:.65}.icons{display:flex;flex-direction:column;gap:20px;width:110px}.appicon{border:0;background:transparent;color:white;cursor:pointer;padding:8px;border-radius:10px;font-size:14px}.appicon:hover,.appicon:focus-visible{background:#ffffff24}.appicon span{display:block;font-size:32px;margin-bottom:6px}.taskbar{height:53px;background:#111c35e8;display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid #51688c}.taskbar button,.window button,.menu button{color:white;background:#29436f;border:1px solid #5c77a5;border-radius:7px;padding:8px 12px;cursor:pointer}.taskbar button:hover,.menu button:hover{background:#3b5d92}.clock{margin-left:auto}.menu{position:absolute;bottom:60px;left:12px;width:235px;background:#182949;border:1px solid #7290bb;border-radius:12px;padding:14px;box-shadow:0 12px 40px #0009}.menu button{display:block;width:100%;margin-top:8px;text-align:left}.window{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:min(590px,calc(100vw - 30px));background:#152441;border:1px solid #7392c5;border-radius:12px;box-shadow:0 18px 65px #000a;overflow:hidden}.titlebar{background:#284574;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.content{padding:20px;min-height:210px}.content textarea{width:100%;min-height:180px;resize:vertical;background:#0b162b;color:white;border:1px solid #6884b0;border-radius:8px;padding:12px}.content input{padding:9px;width:100%;background:#0b162b;color:white;border:1px solid #6884b0;border-radius:8px}.result{font-size:24px;margin:14px 0}.muted{color:#b5c7e7;font-size:13px}.terminal{font-family:monospace;background:#071123;padding:14px;border-radius:8px;line-height:1.7;white-space:pre-wrap}.hide{display:none!important}

/* GenOS Core: wallpaper futurista, leve e responsivo */
body{background:#080e24;overflow-x:hidden}
.desktop{isolation:isolate;overflow:hidden;background:
 radial-gradient(ellipse at 75% 38%,rgba(73,162,255,.38),transparent 32%),
 radial-gradient(ellipse at 27% 78%,rgba(121,63,233,.32),transparent 45%),
 linear-gradient(135deg,#070d20 3%,#13234a 48%,#0b1633 100%)}
.desktop::before{content:"";position:absolute;z-index:-1;inset:-15%;pointer-events:none;background:
 repeating-linear-gradient(0deg,transparent 0 51px,rgba(132,187,255,.075) 52px,transparent 53px),
 repeating-linear-gradient(90deg,transparent 0 51px,rgba(132,187,255,.075) 52px,transparent 53px);
 transform:perspective(680px) rotateX(57deg) scale(1.4) translateY(15%);transform-origin:center bottom;
 mask-image:linear-gradient(to top,#000,transparent 78%)}
.desktop::after{content:"";position:absolute;z-index:-1;width:min(57vw,680px);aspect-ratio:1;right:8%;top:7%;border-radius:50%;pointer-events:none;background:
 radial-gradient(circle at 36% 30%,rgba(255,255,255,.9) 0,rgba(138,212,255,.7) 2%,transparent 9%),
 radial-gradient(circle at 38% 34%,#74c6ff 0%,#2773db 28%,#173b94 49%,#0b1b49 69%,transparent 71%);
 box-shadow:0 0 75px 25px rgba(39,132,255,.22),inset -30px -35px 70px rgba(4,11,42,.75);opacity:.9}
.brand{font-size:clamp(24px,4vw,48px);letter-spacing:.06em;text-shadow:0 2px 30px #0008}
.notice{position:relative;z-index:2;background:linear-gradient(90deg,#142343,#203b6d);border-bottom-color:#6b90c0}
.taskbar{position:relative;z-index:3;backdrop-filter:blur(14px);background:#0a1634e8}
.window,.menu{z-index:4;backdrop-filter:blur(16px);background:#132542ed}
@media(max-width:640px){.desktop::after{width:85vw;right:-20%;top:20%;opacity:.55}.brand{right:16px;top:18px}.icons{gap:9px}.desktop{padding:15px}}
.desktop{overflow-y:auto}.icons{display:grid;grid-template-columns:repeat(2,105px);gap:10px;width:max-content;align-content:start}.appicon{min-height:92px}.menu{max-height:min(65vh,520px);overflow-y:auto}.content{max-height:65vh;overflow:auto}.content button{margin:5px 5px 5px 0}@media(max-width:640px){.icons{grid-template-columns:repeat(2,85px)}.appicon{font-size:12px}.brand{font-size:25px}.window{top:48%}}
/* GenUI v2: visual híbrido inspirado em desktops modernos */
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.desktop{background:radial-gradient(ellipse at 72% 27%,#78b7f766,transparent 35%),radial-gradient(ellipse at 20% 75%,#ab89ff55,transparent 45%),linear-gradient(130deg,#111b42,#23458a 55%,#151c49)}
.desktop::after{filter:blur(3px);opacity:.55}
.taskbar{position:relative;justify-content:center;height:65px;background:#152344aa;border-top:1px solid #ffffff55;box-shadow:0 -8px 35px #0003}
.taskbar::before{content:"";position:absolute;inset:6px max(8px,calc(50% - 290px));border:1px solid #ffffff45;border-radius:18px;background:#dbeaff16;pointer-events:none}
.taskbar button{position:relative;border:1px solid #ffffff55;background:#ffffff20;backdrop-filter:blur(24px);border-radius:12px;font-weight:600}
.clock{position:absolute;right:18px;font-variant-numeric:tabular-nums}.taskbar .muted{position:relative}
.window{border:1px solid #d5e8ff88;border-radius:18px;background:#15284de8;box-shadow:0 28px 80px #020918aa,0 1px 0 #ffffff44 inset}
.titlebar{background:#ffffff14;border-bottom:1px solid #ffffff24;min-height:49px}
.titlebar button{border-radius:50%;padding:5px 10px;background:#e85d70cc;border-color:#ff9ca8}
.menu{border:1px solid #c9e3ff88;border-radius:19px;background:#1c3159e8;box-shadow:0 18px 70px #0009}
.menu button{background:#ffffff12;border-color:#ffffff24;border-radius:11px}
.appicon{border:1px solid transparent;text-shadow:0 2px 12px #06102b}
.appicon:hover{background:#ffffff25;border-color:#ffffff40;backdrop-filter:blur(12px)}
body[data-genui="classic"] .desktop{background:linear-gradient(145deg,#14233f,#254474 65%,#0d1c38)}
body[data-genui="classic"] .window,body[data-genui="classic"] .menu{border-radius:10px}
body[data-genui="classic"] .taskbar{justify-content:flex-start;height:53px;background:#111c35e8}
body[data-genui="classic"] .taskbar::before{display:none}
body[data-genui="classic"] .titlebar button{border-radius:7px}
@media(max-width:640px){.taskbar{justify-content:flex-start}.taskbar .muted{font-size:11px}.clock{right:9px;font-size:12px}.taskbar::before{inset:5px 5px}}
</style></head><body>
<div class="notice"><strong>DEMONSTRAÇÃO WEB DO GENOS V2</strong> — Simulação interativa de interface. Não inicializa o kernel, não executa a ISO e não representa um teste real de hardware.</div>
<main class="desktop"><div class="brand">GenOS <span style="font-weight:400">v2</span></div>
<div class="icons"><button class="appicon" data-app="about"><span>💻</span>Este computador</button><button class="appicon" data-app="notes"><span>📝</span>Notas</button><button class="appicon" data-app="calc"><span>🧮</span>Calculadora</button><button class="appicon" data-app="terminal"><span>⌨️</span>Terminal</button><button class="appicon" data-app="files"><span>📁</span>Arquivos</button><button class="appicon" data-app="settings"><span>⚙️</span>Configurações</button><button class="appicon" data-app="paint"><span>🎨</span>Paint</button><button class="appicon" data-app="calendar"><span>📅</span>Calendário</button><button class="appicon" data-app="store"><span>🛍️</span>GenOS Store</button></div>
<div class="menu hide" id="menu"><strong>GenOS v2</strong><p class="muted">Escolha uma demonstração</p><button data-app="about">Sobre o GenOS</button><button data-app="notes">Notas</button><button data-app="calc">Calculadora</button><button data-app="terminal">Terminal simulado</button><button data-app="files">Gerenciador de arquivos</button><button data-app="settings">Configurações</button><button data-app="paint">Paint</button><button data-app="calendar">Calendário</button><button data-app="monitor">Monitor do sistema</button><button data-app="clockapp">Relógio</button><button data-app="packages">Pacotes .gem</button><button data-app="store">GenOS Store</button></div>
<section class="window hide" id="window" role="dialog" aria-modal="false" aria-labelledby="window-title"><div class="titlebar"><strong id="window-title"></strong><button id="close" aria-label="Fechar janela">✕</button></div><div class="content" id="content"></div></section></main>
<footer class="taskbar"><button id="start" aria-expanded="false" aria-controls="menu">☰ Iniciar</button><span class="muted">GenOS v2 · demo web</span><span class="clock" id="clock"></span></footer>
<script>
document.body.dataset.genui=localStorage.getItem('genos-demo-genui')==='v2'?'v2':'classic';
const menu=document.getElementById('menu'), win=document.getElementById('window'), content=document.getElementById('content'), title=document.getElementById('window-title'), start=document.getElementById('start');
function toggleMenu(force){const show=force??menu.classList.contains('hide');menu.classList.toggle('hide',!show);start.setAttribute('aria-expanded',String(show))}
start.onclick=()=>toggleMenu();document.getElementById('close').onclick=()=>win.classList.add('hide');
function openApp(app){toggleMenu(false);if(app==='store'){window.open('../app-store/index.html','_blank','noopener');return;}win.classList.remove('hide');content.replaceChildren();const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;content.append(e);return e};
if(app==='about'){title.textContent='Este computador';el('h2','GenOS v2 — demonstração');el('p','Experiência visual de um desktop experimental, criada para exploração no navegador.');el('p','O kernel real é um projeto x86-64 inicial, com framebuffer e inicialização via Limine.');el('p','Esta página não executa GenKernel, programas nativos ou a ISO.');}
if(app==='notes'){title.textContent='Notas (demonstração)';el('p','Anotações temporárias nesta aba:');const area=el('textarea');area.placeholder='Digite suas notas…';area.setAttribute('aria-label','Editor de notas');el('p','As notas não são salvas em disco.').className='muted';}
if(app==='calc'){title.textContent='Calculadora (demonstração)';el('p','Soma de dois números:');const a=el('input');a.type='number';a.placeholder='Primeiro número';a.setAttribute('aria-label','Primeiro número');const b=el('input');b.type='number';b.placeholder='Segundo número';b.setAttribute('aria-label','Segundo número');const result=el('div','Resultado: —');result.className='result';const btn=el('button','Somar');btn.onclick=()=>{const x=Number(a.value),y=Number(b.value);result.textContent=a.value&&b.value&&Number.isFinite(x+y)?'Resultado: '+(x+y):'Digite dois números válidos';};}
if(app==='files'){title.textContent='Arquivos — demonstração';el('h3','📁 Meu computador');el('p','Pastas ilustrativas (não são arquivos reais do kernel):');['📁 Documentos','📁 Imagens','📁 Aplicativos','📦 Pacotes .gem'].forEach(x=>{const b=el('button',x);b.style.margin='5px';b.onclick=()=>{const p=el('p',x+' — diretório simulado, sem acesso ao disco.');p.className='muted'}});}
if(app==='settings'){title.textContent='Configurações';el('h3','Personalização da demonstração');el('p','Ajuste o brilho visual do desktop:');const range=el('input');range.type='range';range.min='60';range.max='130';range.value='100';range.oninput=()=>document.querySelector('.desktop').style.filter='brightness('+range.value+'%)';el('p','O ajuste afeta apenas esta página web.').className='muted';const theme=el('button','Ativar GenUI v2');theme.onclick=()=>{document.body.dataset.genui='v2';localStorage.setItem('genos-demo-genui','v2')};const classic=el('button','Tema clássico');classic.onclick=()=>{document.body.dataset.genui='classic';localStorage.setItem('genos-demo-genui','classic')};}
if(app==='paint'){title.textContent='Paint — desenho no navegador';const bar=el('div');bar.style.marginBottom='10px';const picker=document.createElement('input');picker.type='color';picker.value='#58b8ff';picker.setAttribute('aria-label','Cor do pincel');bar.append(picker);const clear=document.createElement('button');clear.textContent='Limpar desenho';bar.append(clear);const canvas=el('canvas');canvas.width=510;canvas.height=260;canvas.style.cssText='width:100%;height:260px;background:white;border-radius:8px;touch-action:none';const ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';let drawing=false;const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!drawing)return;ctx.strokeStyle=picker.value;ctx.lineTo(...point(e));ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;clear.onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);}
if(app==='calendar'){title.textContent='Calendário';const now=new Date();el('h3',now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));const table=el('div');table.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center';['D','S','T','Q','Q','S','S'].forEach(x=>{const e=document.createElement('strong');e.textContent=x;table.append(e)});const first=new Date(now.getFullYear(),now.getMonth(),1).getDay(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let i=0;i<first;i++)table.append(document.createElement('span'));for(let d=1;d<=days;d++){const e=document.createElement('span');e.textContent=d;e.style.cssText='padding:8px;border-radius:7px;background:'+(d===now.getDate()?'#3c74bb':'#203555');table.append(e)}}
if(app==='monitor'){title.textContent='Monitor do sistema — ilustrativo';el('h3','GenOS v2 · painel de demonstração');['CPU','Memória','Disco'].forEach((x,i)=>{el('p',x+' — indicador fictício');const b=el('div');b.style.cssText='height:14px;background:#0b162b;border-radius:8px;overflow:hidden';const fill=document.createElement('div');fill.style.cssText='height:100%;width:'+([28,45,16][i])+'%;background:#56a8ff';b.append(fill)});el('p','Os valores não representam uso real do kernel.').className='muted';}
if(app==='clockapp'){title.textContent='Relógio';el('h2',new Date().toLocaleString('pt-BR'));el('p','Horário fornecido pelo navegador.').className='muted';}
if(app==='packages'){title.textContent='Pacotes .gem';el('h3','Gerenciador .gem — demonstração');el('p','O formato .gem é experimental e não executa aplicativos nativamente no kernel atual.');const b=el('button','Conhecer a suíte GenOS');b.onclick=()=>window.open('https://github.com/ProjectsVanguard/GenOS/blob/main/docs/GENOS-SUITE-GEM.md','_blank','noopener');}
if(app==='terminal'){title.textContent='Terminal (simulado)';const t=el('div','GenOS v2 demo shell\\nComandos: help, about, version, date, get-updates, clear');t.className='terminal';const input=el('input');input.placeholder='Digite get-updates e pressione Enter';input.setAttribute('aria-label','Comando simulado');input.onkeydown=async e=>{if(e.key!=='Enter')return;const cmd=input.value.trim().toLowerCase();input.value='';if(cmd==='clear'){t.textContent='';return;}t.textContent+='\\n> '+cmd+'\\n';const write=x=>{t.textContent+='\\n'+x};if(cmd==='help'){write('help, about, version, date, get-updates (alias: get-update), clear');return;}if(cmd==='about'){write('Terminal web demonstrativo. Não possui acesso ao kernel, disco ou privilégios de administrador.');return;}if(cmd==='version'){write('GenOS v2 · demonstração web');return;}if(cmd==='date'){write(new Date().toLocaleString('pt-BR'));return;}if(cmd==='get-update'||cmd==='get-updates'){write('[1/4] Consultando releases públicas do GenOS…');try{const response=await fetch('https://api.github.com/repos/ProjectsVanguard/GenOS/releases/latest',{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw new Error('GitHub API HTTP '+response.status);const release=await response.json();write('[2/4] Release mais recente: '+(release.tag_name||'sem tag'));write('[3/4] Canais de atualização disponíveis:');write('• Site / GenUI: recarregue a demonstração após a publicação do GitHub Pages.');write('• ISO v2: https://github.com/ProjectsVanguard/GenOS/releases');write('• Pacotes .gem e suíte: https://github.com/ProjectsVanguard/GenOS/actions');write('• Kernel / atualizações de segurança: https://github.com/ProjectsVanguard/GenOS/actions/workflows/publish-security-update.yml');write('[4/4] Verificação concluída.');if(release.html_url)write('Release: '+release.html_url);const assets=release.assets||[];if(assets.length){write('Arquivos desta release para download:');for(const asset of assets){const a=document.createElement('a');a.href=asset.browser_download_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↓ '+asset.name+' ('+asset.size+' bytes)';a.style.display='block';a.style.margin='6px 0';a.style.color='#8ce7ff';content.append(a);}}else{write('Esta release ainda não tem arquivos anexados; confira Actions para artifacts.');}write('Limite: o comando disponibiliza links de download, mas não instala kernel, ISO nem pacotes automaticamente.');const link=el('button','Abrir última release');link.onclick=()=>window.open(release.html_url,'_blank','noopener');const actions=el('button','Ver artifacts de todas as atualizações');actions.onclick=()=>window.open('https://github.com/ProjectsVanguard/GenOS/actions','_blank','noopener');}catch(err){write('Não foi possível consultar a release agora: '+err.message);write('Consulte manualmente https://github.com/ProjectsVanguard/GenOS/releases');}return;}write('Comando não disponível. Digite help.');};}}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){win.classList.add('hide');toggleMenu(false)}});
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);
</script></body></html>
