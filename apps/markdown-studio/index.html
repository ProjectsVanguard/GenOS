<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Studio · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:1200px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head{display:flex;justify-content:space-between}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242a3d;color:var(--text)}button{cursor:pointer}.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}h2{font-size:14px;color:var(--muted);margin:0;padding:12px 15px;border-bottom:1px solid var(--line)}textarea{display:block;width:100%;height:62vh;resize:vertical;padding:18px;background:transparent;border:0;color:var(--text);font:14px/1.7 ui-monospace,monospace;outline:none}#preview{height:62vh;overflow:auto;padding:18px;line-height:1.7}#preview h1,#preview h2,#preview h3{line-height:1.25}#preview code{background:#292f42;padding:2px 5px;border-radius:5px}#preview pre{white-space:pre-wrap;background:#0b0d13;padding:12px;border-radius:9px}#preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted)}.muted{color:var(--muted);font-size:12px}@media(max-width:700px){.panes{grid-template-columns:1fr}textarea,#preview{height:38vh}}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite GenOS</a><span>ESCRITA · MARKDOWN</span></div><h1>Markdown Studio</h1><p class="muted">Escreva Markdown, visualize uma prévia e exporte o arquivo. O conteúdo é tratado como texto para evitar execução de HTML.</p><div class="toolbar"><button id="save">Salvar rascunho</button><button id="export">Exportar .md</button><button id="clear">Limpar</button><span class="muted" id="status">Pronto</span></div><div class="panes"><section><h2>EDITOR</h2><textarea id="source" spellcheck="false" aria-label="Markdown"># Meu documento

Escreva suas ideias com **Markdown**.

## Lista de tarefas
- Primeiro item
- Segundo item

> Uma citação ou nota importante.

Código inline: `print("Olá, GenOS!")`
</textarea></section><section><h2>PRÉVIA</h2><article id="preview"></article></section></div></main><script>(()=>{const src=document.querySelector('#source'),preview=document.querySelector('#preview'),status=document.querySelector('#status'),key='genos.markdown.v1';try{src.value=localStorage.getItem(key)||src.value}catch{}function escape(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const lines=src.value.split('\n');let html='',list=false,code=false,buf=[];function closeList(){if(list){html+='</ul>';list=false}}for(const line of lines){if(line.startsWith('```')){closeList();if(code){html+='<pre><code>'+escape(buf.join('\n'))+'</code></pre>';buf=[];code=false}else code=true;continue}if(code){buf.push(line);continue}if(/^\s*[-*]\s+/.test(line)){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.replace(/^\s*[-*]\s+/,''))+'</li>';continue}closeList();if(!line.trim()){continue}if(/^###\s/.test(line))html+='<h3>'+inline(line.slice(4))+'</h3>';else if(/^##\s/.test(line))html+='<h2>'+inline(line.slice(3))+'</h2>';else if(/^#\s/.test(line))html+='<h1>'+inline(line.slice(2))+'</h1>';else if(/^>\s?/.test(line))html+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';else html+='<p>'+inline(line)+'</p>'}closeList();if(code)html+='<pre><code>'+escape(buf.join('\n'))+'</code></pre>';preview.innerHTML=html||'<p class="muted">A prévia aparecerá aqui.</p>'}function inline(s){return escape(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}src.addEventListener('input',render);document.querySelector('#save').onclick=()=>{try{localStorage.setItem(key,src.value);status.textContent='Rascunho salvo neste navegador'}catch{status.textContent='Armazenamento local indisponível'}};document.querySelector('#export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([src.value],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download='documento.md';a.click();URL.revokeObjectURL(u)};document.querySelector('#clear').onclick=()=>{if(confirm('Limpar o documento atual?')){src.value='';render()}};render()})();</script></body></html>
