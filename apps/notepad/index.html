<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS Bloco de Notas</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui}header{padding:18px 5%;background:#151e32;border-bottom:1px solid #30405f;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0 auto 0 0}button{background:#70e1cf;color:#08131c;border:0;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}main{max-width:1000px;margin:24px auto;padding:0 16px}input{width:100%;box-sizing:border-box;padding:12px;background:#151e32;border:1px solid #30405f;color:white;border-radius:8px;margin-bottom:12px}textarea{width:100%;height:68vh;box-sizing:border-box;background:#10182a;color:#e7eeff;border:1px solid #30405f;border-radius:10px;padding:16px;font:15px ui-monospace,monospace;resize:vertical}</style><header><h1>📝 Bloco de Notas</h1><button id="save">Baixar .txt</button><button id="clear">Limpar</button></header><main><input id="filename" value="anotacoes.txt" aria-label="Nome do arquivo"><textarea id="text" placeholder="Comece a escrever…"></textarea></main><script>const t=document.querySelector('#text'),f=document.querySelector('#filename');t.value=localStorage.getItem('genos-notes')||'';t.addEventListener('input',()=>localStorage.setItem('genos-notes',t.value));document.querySelector('#save').onclick=()=>{let a=document.createElement('a'),b=new Blob([t.value],{type:'text/plain;charset=utf-8'});a.href=URL.createObjectURL(b);a.download=f.value.trim()||'anotacoes.txt';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clear').onclick=()=>{if(confirm('Apagar o texto atual?')){t.value='';localStorage.removeItem('genos-notes')}};</script></html>
