<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:26px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}a{color:#c4b5fd;text-decoration:none}h1{margin:4px 0;font-size:30px}p{color:var(--muted)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:11px}input{flex:1;min-width:160px}button{cursor:pointer}button.primary{background:var(--accent);color:#151122;border-color:transparent;font-weight:700}textarea{width:100%;height:55vh;resize:vertical;line-height:1.6;padding:18px;outline:none}textarea:focus,input:focus{border-color:var(--accent)}.status{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-top:10px}</style></head><body><main class="wrap"><header class="top"><a href="../genos-suite/index.html">← Suite GenOS</a><span>EDITOR DE TEXTO</span></header><h1>Notas</h1><p>O rascunho é salvo neste navegador. Use Exportar para criar um arquivo .txt.</p><div class="bar"><input id="filename" aria-label="Nome do arquivo" value="minhas-notas.txt"><button id="new">Nova nota</button><button id="save" class="primary">Salvar agora</button><button id="export">Exportar .txt</button></div><textarea id="note" placeholder="Comece a escrever…"></textarea><div class="status"><span id="state">Pronto</span><span id="count">0 caracteres</span></div></main><script>(()=>{const note=document.querySelector('#note'),name=document.querySelector('#filename'),state=document.querySelector('#state'),count=document.querySelector('#count');const key='genos.notepad.v1';try{note.value=localStorage.getItem(key)||''}catch{}function update(){count.textContent=note.value.length+' caracteres';try{localStorage.setItem(key,note.value);state.textContent='Salvo neste navegador'}catch{state.textContent='Armazenamento local indisponível'}}note.addEventListener('input',update);document.querySelector('#save').onclick=update;document.querySelector('#new').onclick=()=>{if(!note.value||confirm('Criar uma nota nova? Exporte o texto atual se quiser guardá-lo.')){note.value='';update();note.focus()}};document.querySelector('#export').onclick=()=>{const blob=new Blob([note.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(name.value.trim()||'minhas-notas.txt').replace(/[\\/:*?"<>|]/g,'_');a.click();URL.revokeObjectURL(url)};update()})();</script></body></html>
