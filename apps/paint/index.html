<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS Paint</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px;background:#151e32;border-bottom:1px solid #30405f}h1{font-size:20px;margin:0 auto 0 0}button{background:#70e1cf;color:#09171d;border:0;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}label{display:flex;align-items:center;gap:6px}main{padding:18px}canvas{display:block;width:100%;height:calc(100vh - 130px);background:white;border-radius:8px;touch-action:none;cursor:crosshair}</style><header><h1>🎨 GenOS Paint</h1><label>Cor <input type="color" id="color" value="#14213d"></label><label>Pincel <input type="range" id="size" min="1" max="40" value="5"></label><button id="clear">Limpar</button><button id="save">Exportar PNG</button></header><main><canvas id="c" width="1400" height="800"></canvas></main><script>const c=document.querySelector('#c'),ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);let down=false;function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!down)return;let p=pos(e);ctx.strokeStyle=document.querySelector('#color').value;ctx.lineWidth=+document.querySelector('#size').value;c.getContext('2d').lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;document.querySelector('#clear').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)};document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.download='genos-desenho.png';a.href=c.toDataURL('image/png');a.click()};</script></html>
