<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenho · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head{display:flex;justify-content:space-between;gap:10px}h1{margin:18px 0 8px}p{color:var(--muted)}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:16px 0}button,input{font:inherit}button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#252b3d;color:var(--text);cursor:pointer}input[type=color]{width:42px;height:36px;border:0;background:transparent}input[type=range]{width:120px}canvas{display:block;width:100%;height:min(62vh,620px);background:white;border-radius:14px;touch-action:none;cursor:crosshair;box-shadow:0 8px 30px #0003}.muted{font-size:12px;color:var(--muted)}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite GenOS</a><span>CRIATIVIDADE</span></div><h1>Desenho</h1><p>Área de desenho simples com exportação em PNG.</p><div class="tools"><label>Cor <input id="color" type="color" value="#24243a"></label><label>Espessura <input id="size" type="range" min="1" max="40" value="5"></label><button id="undo">Desfazer</button><button id="clear">Limpar</button><button id="save">Exportar PNG</button></div><canvas id="board" width="1400" height="850" aria-label="Área de desenho"></canvas><p class="muted">Dica: clique e arraste ou desenhe com o toque em telas compatíveis.</p></main><script>(()=>{const c=document.querySelector('#board'),ctx=c.getContext('2d'),color=document.querySelector('#color'),size=document.querySelector('#size');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);let down=false,last=null,history=[];function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{down=true;last=point(e);c.setPointerCapture(e.pointerId);history.push(ctx.getImageData(0,0,c.width,c.height));if(history.length>12)history.shift()});c.addEventListener('pointermove',e=>{if(!down)return;const p=point(e);ctx.strokeStyle=color.value;ctx.lineWidth=Number(size.value)*c.width/c.getBoundingClientRect().width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});function stop(){down=false;last=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.querySelector('#clear').onclick=()=>{history.push(ctx.getImageData(0,0,c.width,c.height));ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)};document.querySelector('#undo').onclick=()=>{const img=history.pop();if(img)ctx.putImageData(img,0,0)};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='genos-desenho.png';a.href=c.toDataURL('image/png');a.click()}})();</script></body></html>
