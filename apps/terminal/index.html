<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenOS Terminal Demo</title><style>body{margin:0;background:#070b12;color:#d8fbe7;font:15px ui-monospace,monospace}.term{max-width:950px;margin:30px auto;border:1px solid #28533d;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #0008}.bar{background:#182a22;padding:13px;color:#9de7ba}.out{padding:18px;min-height:55vh;white-space:pre-wrap;line-height:1.6}.line{display:flex;gap:9px;padding:12px 18px;border-top:1px solid #28533d}.prompt{color:#70e1cf}input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit}small{color:#8da99a}</style><div class="term"><div class="bar">● ● ● &nbsp; GenOS Terminal — DEMO</div><div id="out" class="out">GenOS Terminal Demo v0.1
Esta é uma simulação segura; nenhum comando do sistema é executado.
Digite help para ver os comandos disponíveis.
</div><form id="form" class="line"><span class="prompt">genos@demo:~$</span><input id="cmd" autocomplete="off" autofocus aria-label="Comando"></form></div><script>const out=document.querySelector('#out'),form=document.querySelector('#form'),cmd=document.querySelector('#cmd');const commands={help:'Comandos simulados: help, about, date, clear, apps, uname',about:'GenOS Genesis: protótipo experimental x86_64.',date:()=>new Date().toString(),apps:'GenOS Suite, Calculadora, Bloco de Notas, Paint, Calendário, Solaris Networking',uname:'GenKernel experimental (informação demonstrativa).'};form.onsubmit=e=>{e.preventDefault();let s=cmd.value.trim();out.textContent+='\n$ '+s+'\n';if(s==='clear')out.textContent='';else if(s in commands)out.textContent+=(typeof commands[s]==='function'?commands[s]():commands[s])+'\n';else out.textContent+='Comando desconhecido nesta demonstração. Digite help.\n';cmd.value='';out.scrollTop=out.scrollHeight};</script></html>
