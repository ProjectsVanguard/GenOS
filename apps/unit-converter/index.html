<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversor · GenOS</title><style>:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#30384d;--text:#f4f5fb;--muted:#a2acc0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}.wrap{max-width:780px;margin:auto;padding:24px 16px}a{color:#c4b5fd;text-decoration:none}.head{display:flex;justify-content:space-between}h1{margin:20px 0 8px}.muted{color:var(--muted)}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-top:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:#242a3d;color:var(--text)}button{cursor:pointer}.tabs button.active{background:var(--accent);color:#161221}.fields{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;min-width:0}.result{font-size:30px;font-weight:800;margin-top:20px;overflow-wrap:anywhere;color:#c4b5fd}@media(max-width:560px){.fields{grid-template-columns:1fr}.swap{display:none}}</style></head><body><main class="wrap"><div class="head"><a href="../genos-suite/index.html">← Suite GenOS</a><span>CONVERSÕES</span></div><h1>Conversor de unidades</h1><p class="muted">Converta comprimento, massa, temperatura e armazenamento.</p><section class="card"><div class="tabs" id="tabs"><button data-kind="length" class="active">Comprimento</button><button data-kind="mass">Massa</button><button data-kind="temp">Temperatura</button><button data-kind="data">Armazenamento</button></div><div class="fields"><div class="field"><label for="value">Valor</label><input id="value" type="number" value="1" step="any"></div><button class="swap" id="swap" aria-label="Inverter unidades">⇄</button><div class="field"><label for="from">De</label><select id="from"></select></div><div class="field"><label for="to">Para</label><select id="to"></select></div></div><div class="result" id="result"></div><p class="muted" id="formula"></p></section></main><script>(()=>{const sets={length:{units:{'Metro (m)':1,'Quilômetro (km)':1000,'Centímetro (cm)':.01,'Milímetro (mm)':.001,'Milha (mi)':1609.344,'Jarda (yd)':.9144,'Pé (ft)':.3048,'Polegada (in)':.0254}},mass:{units:{'Quilograma (kg)':1,'Grama (g)':.001,'Miligrama (mg)':.000001,'Libra (lb)':.45359237,'Onça (oz)':.028349523125}},data:{units:{'Byte (B)':1,'Kilobyte (KB)':1000,'Megabyte (MB)':1e6,'Gigabyte (GB)':1e9,'Kibibyte (KiB)':1024,'Mebibyte (MiB)':1048576,'Gibibyte (GiB)':1073741824}},temp:{units:{'Celsius (°C)':1,'Fahrenheit (°F)':1,'Kelvin (K)':1}}};let kind='length';const $=s=>document.querySelector(s);function populate(){const names=Object.keys(sets[kind].units);$('#from').replaceChildren(...names.map((n,i)=>new Option(n,n)));$('#to').replaceChildren(...names.map((n,i)=>new Option(n,n)));$('#to').selectedIndex=Math.min(1,names.length-1);convert()}function celsius(v,u){return u.startsWith('Fahrenheit')?(v-32)*5/9:u.startsWith('Kelvin')?v-273.15:v}function fromC(v,u){return u.startsWith('Fahrenheit')?v*9/5+32:u.startsWith('Kelvin')?v+273.15:v}function convert(){const v=Number($('#value').value),a=$('#from').value,b=$('#to').value;if(!Number.isFinite(v)){ $('#result').textContent='Digite um valor válido';return}let r;if(kind==='temp')r=fromC(celsius(v,a),b);else r=v*sets[kind].units[a]/sets[kind].units[b];$('#result').textContent=Number(r.toPrecision(10)).toLocaleString('pt-BR',{maximumFractionDigits:8})+' '+b.match(/\((.+)\)/)?.[1];$('#formula').textContent=v.toLocaleString('pt-BR')+' '+a.match(/\((.+)\)/)?.[1]+' = '+Number(r.toPrecision(10)).toLocaleString('pt-BR',{maximumFractionDigits:8})+' '+b.match(/\((.+)\)/)?.[1]}$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.kind;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));populate()};$('#swap').onclick=()=>{const a=$('#from').value;$('#from').value=$('#to').value;$('#to').value=a;convert()};['value','from','to'].forEach(s=>$('#'+s).addEventListener('input',convert));populate()})();</script></body></html>
