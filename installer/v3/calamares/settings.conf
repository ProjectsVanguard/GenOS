# Scaffold para uma sessão live Linux com Calamares.
# Validar contra a versão de Calamares instalada na mídia live.
modules-search: [ local ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - fstab
      - locale
      - keyboard
      - users
      - displaymanager
      - bootloader
      - packages
      - finished
branding: genos-v3
prompt-install: true
dont-chroot: false
